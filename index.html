<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <title>Lista de compras</title>
  <link rel="stylesheet" href="./style/index.css">
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
    rel="stylesheet">
</head>

<body>

  <form class="container">
    <header class="disabled"> 
      <img src="./assets/logo.svg" alt="Logo da quicklist"> 
    </header>

    <section class="add-item-section"> <a href="#">
       <img src="./assets/icons/voltar.svg" alt=""> </a>
      <h1>Compras da semana</h1>
      <div class="add-item-container"> 
        <input type="text" placeholder="Adicione um novo item" id="taskInput" required>

        <button id="addItemButton">Adicionar item</button>
      </div>
    </section>
    <section>
      <ul id="taskList">
        <!-- <li class="task-item"> <input type="checkbox">
          <div></div>
          <p>Pão de forma</p> 
          <button></button>
        </li> -->
      </ul>
    </section>

    <span class="notification disabledNotification ">
      <img src="./assets/icons/warning.svg" alt="icone de alerta">
      <p>O item foi removido da lista</p> <button class="close-notification"></button>
    </span>
  </form>
  <script src="./script.js"></script>
</body>

</html>
