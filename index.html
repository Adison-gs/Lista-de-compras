<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <title>Lista de compras</title>
  <link rel="stylesheet" href="./style/index.css">
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
    rel="stylesheet">
</head>

<body>

  <header class="none"><img src="./assets/logo.svg" alt="Logo da quicklist"></header>

  <main class="container">

    <section class="adicionar">

         <a href="#"><img src="./assets/icons/voltar.svg" alt=""></a>
         <h1>Compras da semana</h1>

      <div class="itens">
         <input type="text"  placeholder="Adicione um novo item">
         <button>Adicionar item</button>
      </div>

    </section>
    <section>
      <ul>
        <li class="list">
          <input type="checkbox">
          <div></div>
          <p>Pão de forma</p>
          <a href="#"><img src="./assets/icons/lixeira.svg" alt="Icone de lixeira"></a>
        </li>
      </ul>
    </section>

    <span class="disabled">
      <img src="./assets/icons/warning.svg" alt="icone de alerta">
      <p>O item foi removido da lista</p>
      <img src="./assets/icons/x.svg" alt="icone de um x">
    </span>
  </main>

</body>

</html>
